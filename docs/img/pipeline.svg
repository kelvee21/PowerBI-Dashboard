00 888,400" fill="none" stroke="#64748B" stroke-width="1.4" opacity=".8" marker-end="url(#ar)"/><path d="M530,87 C565,87 565,46 600,46 L860,46 C875,46 875,70 888,74" fill="none" stroke="#64748B" stroke-width="1.4" opacity=".8" marker-end="url(#ar)"/><path d="M530,151 C560,151 560,160 600,162 L860,162 C875,162 875,170 888,170" fill="none" stroke="#64748B" stroke-width="1.4" opacity=".8" marker-end="url(#ar)"/><path d="M1090,160 C1109.0,160 1109.0,150 1128,150" fill="none" stroke="#64748B" stroke-width="1.4" opacity="0.8" marker-end="url(#ar)"/><path d="M1090,340 C1109.0,340 1109.0,348 1128,348" fill="none" stroke="#64748B" stroke-width="1.4" opacity="0.8" marker-end="url(#ar)"/><rect x="300" y="458" width="520" height="40" rx="8" fill="#FFFBEB" stroke="#F0C36D" stroke-width="1.4"/><text x="310" y="478" font-size="12" fill="#0F172A" font-weight="600" text-anchor="start">Config: Tracks (Cohort · Track · Folder · CertificationType) + RawRoot</text><text x="810" y="492" font-size="11" fill="#475569" font-weight="400" text-anchor="end">feeds every file query · a new cohort = one row</text><rect x="16" y="514" width="1074" height="56" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.4" stroke-dasharray="6 4"/><text x="26" y="534" font-size="12" fill="#0F172A" font-weight="600" text-anchor="start">Verification (not part of the load path): etl/prepare_data.py rebuilds the same tables from data/raw with pandas</text><text x="26" y="552" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">Its tables and totals are compared with the refreshed model. The script stops if any of 11 data-quality checks fails.</text><text x="16" y="596" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">● = loaded to the model; other queries are staging only (load disabled). Arrows show which query reads which.</text><text x="16" y="616" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">Queries that read files never also reference other queries (avoids the Formula.Firewall error).</text></svg>