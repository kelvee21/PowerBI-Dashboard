<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 632" width="1280" height="632" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs><rect width="1280" height="632" fill="#FFFFFF"/><text x="16" y="34" font-size="13.5" fill="#0F766E" font-weight="700" text-anchor="start">1 · Sources (data/raw)</text><text x="300" y="34" font-size="13.5" fill="#0F766E" font-weight="700" text-anchor="start">2 · Ingest: file queries</text><text x="600" y="34" font-size="13.5" fill="#0F766E" font-weight="700" text-anchor="start">3 · Transform: reference queries</text><text x="890" y="34" font-size="13.5" fill="#0F766E" font-weight="700" text-anchor="start">4 · Serve: semantic model</text><text x="1130" y="34" font-size="13.5" fill="#0F766E" font-weight="700" text-anchor="start">5 · Report</text><rect x="16" y="60" width="220" height="110" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/><text x="26" y="80" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">Zoom Attendance (CSV)</text><text x="26" y="98" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">100 daily exports, 2 tracks</text><text x="26" y="113" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">Week 1–10 folders</text><text x="26" y="128" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">file name = class date</text><text x="26" y="143" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">duration h:mm:ss or minutes</text><rect x="16" y="186" width="220" height="70" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/><text x="26" y="206" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">Participation (XLSX)</text><text x="26" y="224" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">per day: comma-separated</text><text x="26" y="239" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">display names, no e-mail</text><rect x="16" y="272" width="220" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/><text x="26" y="292" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">Status of Learners (XLSX)</text><text x="26" y="310" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">roster: e-mail, graduation,</text><text x="26" y="325" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">certification outcome</text><rect x="16" y="368" width="220" height="70" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.4"/><text x="26" y="388" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">Labs &amp; Quizzes (XLSX)</text><text x="26" y="406" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">wide: a column per</text><text x="26" y="421" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">week × Lab / Quiz</text><rect x="300" y="60" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/><text x="310" y="80" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">ClassSchedule ●</text><text x="310" y="98" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">file names → class days per</text><text x="310" y="113" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">cohort-track + ProgrammeWeek</text><rect x="300" y="124" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/><text x="310" y="144" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">FactAttendance ●</text><text x="310" y="162" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">combine CSVs, duration → min,</text><text x="310" y="177" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">Attended = minutes &gt; 30</text><rect x="300" y="188" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/><text x="310" y="208" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">stgZoomNames</text><text x="310" y="226" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">e-mail → display name</text><rect x="300" y="252" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/><text x="310" y="272" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">FactParticipation ●</text><text x="310" y="290" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">split names to rows, match to</text><text x="310" y="305" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">roster with fnNormalizeName</text><rect x="300" y="316" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/><text x="310" y="336" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">stgRoster</text><text x="310" y="354" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">one row per enrolment,</text><text x="310" y="369" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">LearnerKey = Cohort|Track|email</text><rect x="300" y="380" width="230" height="54" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/><text x="310" y="400" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">stgAssessment</text><text x="310" y="418" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">unpivot 20 week columns</text><text x="310" y="433" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">→ one row per week × type</text><rect x="600" y="80" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/><text x="610" y="100" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">DimDate ●</text><text x="610" y="118" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">contiguous calendar (68 days)</text><text x="610" y="133" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">Month, Week, IsClassDay</text><rect x="600" y="180" width="220" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/><text x="610" y="200" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">DimLearner ●</text><text x="610" y="218" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">roster + names + outcomes</text><text x="610" y="233" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">AttendedClassDays vs</text><text x="610" y="248" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">ScheduledClassDays (own cohort)</text><text x="610" y="263" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">HasIncompleteAttendance</text><text x="610" y="278" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">IsDropout (3-part rule)</text><rect x="600" y="320" width="220" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/><text x="610" y="340" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">FactAssessment ●</text><text x="610" y="358" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">Score, IsCompleted (&gt; 0)</text><text x="610" y="373" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">AssessmentDate = last class</text><text x="610" y="388" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">day of that programme week</text><rect x="890" y="60" width="200" height="378" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.4"/><text x="900" y="80" font-size="13" fill="#0F766E" font-weight="600" text-anchor="start">Star schema</text><text x="902" y="104" font-size="12" fill="#0F172A" font-weight="400" text-anchor="start">DimLearner</text><text x="1078" y="104" font-size="12" fill="#475569" font-weight="400" text-anchor="end">140</text><text x="902" y="130" font-size="12" fill="#0F172A" font-weight="400" text-anchor="start">DimDate</text><text x="1078" y="130" font-size="12" fill="#475569" font-weight="400" text-anchor="end">68</text><text x="902" y="156" font-size="12" fill="#0F172A" font-weight="400" text-anchor="start">ClassSchedule (hidden)</text><text x="1078" y="156" font-size="12" fill="#475569" font-weight="400" text-anchor="end">100</text><text x="902" y="182" font-size="12" fill="#0F172A" font-weight="400" text-anchor="start">FactAttendance</text><text x="1078" y="182" font-size="12" fill="#475569" font-weight="400" text-anchor="end">7,000</text><text x="902" y="208" font-size="12" fill="#0F172A" font-weight="400" text-anchor="start">FactParticipation</text><text x="1078" y="208" font-size="12" fill="#475569" font-weight="400" text-anchor="end">6,037</text><text x="902" y="234" font-size="12" fill="#0F172A" font-weight="400" text-anchor="start">FactAssessment</text><text x="1078" y="234" font-size="12" fill="#475569" font-weight="400" text-anchor="end">2,800</text><line x1="902" y1="250" x2="1078" y2="250" stroke="#CBD5E1"/><text x="902" y="276" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">7 one-to-many relationships,</text><text x="902" y="293" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">single direction</text><text x="902" y="310" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">DimDate marked as date table</text><text x="902" y="327" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">_Measures: 31 DAX measures</text><text x="902" y="344" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">in display folders</text><text x="902" y="376" font-size="10.5" fill="#475569" font-weight="400" text-anchor="start" font-style="italic">Rows = refreshed counts</text><rect x="1130" y="60" width="134" height="180" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/><text x="1140" y="80" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">Page 1</text><text x="1140" y="98" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">Overall</text><text x="1140" y="113" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">Performance</text><text x="1140" y="128" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start"></text><text x="1140" y="143" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">4 KPI cards</text><text x="1140" y="158" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">6 track charts</text><text x="1140" y="173" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">4 synced slicers</text><rect x="1130" y="258" width="134" height="180" rx="8" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/><text x="1140" y="278" font-size="13" fill="#0F172A" font-weight="600" text-anchor="start">Page 2</text><text x="1140" y="296" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">Learner Insights</text><text x="1140" y="311" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start"></text><text x="1140" y="326" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">6 KPI cards</text><text x="1140" y="341" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">learner table</text><text x="1140" y="356" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">7 slicers</text><text x="1140" y="371" font-size="11.5" fill="#475569" font-weight="400" text-anchor="start">(4 synced)</text><path d="M236,115.0 C267.0,115.0 267.0,87 298,87" fill="none" stroke="#64748B" stroke-width="1.4" opacity="0.8" marker-end="url(#ar)"/><path d="M236,115.0 C267.0,115.0 267.0,151 298,151" fill="none" stroke="#64748B" stroke-width="1.4" opacity="0.8" marker-end="url(#ar)"/><path d="M236,115.0 C267.0,115.0 267.0,215 298,215" fill="none" stroke="#64